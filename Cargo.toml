[package]
name = "tdv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
gix = { version = "=0.87.1", default-features = false, features = ["status", "blob-diff", "dirwalk", "revision", "parallel", "max-performance-safe", "sha1"] }
ignore = "0.4.33"
lru = "0.18.2"
ratatui = "0.30"
thiserror = "2.0.20"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
